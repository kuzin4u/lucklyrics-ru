<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Irrigation Systems LLC — прототип сайта v22</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Georgian:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#145A86; --blue-d:#0F4566; --green:#2B7A4B; --white:#FFFFFF; --bg:#F4F7F8; --ink:#23313A;
  --muted:#5A6A74; --line:#D9E2E6; --surface:#FFFFFF; --soft:#E6EFF4; --leaf:#DCEBE1;
  --sky:#DCEAF2; --ground:#C9DCC9; --ground2:#A9C9AE; --water:#5FA3C9; --metal:#8FA3AF;
  --warn:#9A2F25; --header-h:69px;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --blue:#5FA8D6; --blue-d:#8CC3E6; --green:#6CC48F; --white:#0E1A21; --bg:#0E1A21; --ink:#E3ECF0;
    --muted:#9DB0BA; --line:#2A3C47; --surface:#15242D; --soft:#1A3140; --leaf:#183527;
    --sky:#1B3443; --ground:#1F3B2B; --ground2:#2A5039; --water:#4E91B8; --metal:#5E7380;
    --warn:#F0938A; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --blue:#5FA8D6; --blue-d:#8CC3E6; --green:#6CC48F; --white:#0E1A21; --bg:#0E1A21; --ink:#E3ECF0;
  --muted:#9DB0BA; --line:#2A3C47; --surface:#15242D; --soft:#1A3140; --leaf:#183527;
  --sky:#1B3443; --ground:#1F3B2B; --ground2:#2A5039; --water:#4E91B8; --metal:#5E7380;
  --warn:#F0938A; color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + var(--header-h) + 12px);scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Noto Sans","Noto Sans Georgian",system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
a{color:var(--blue)}
img,svg{max-width:100%}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
:focus-visible{outline:3px solid var(--green);outline-offset:2px}

/* prototype ribbon */
.proto{background:var(--soft);color:var(--muted);font-size:13px;text-align:center;padding:6px 16px}

/* header */
header.site{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
header.site .wrap{display:flex;align-items:center;gap:20px;height:var(--header-h)}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.logo svg{width:34px;height:34px;flex-shrink:0}
.logo small{display:block;font-weight:400;font-size:11px;color:var(--muted);letter-spacing:0}
nav.main{display:flex;gap:2px;margin-left:auto}
nav.main a{padding:8px 11px;border-radius:6px;color:var(--ink);text-decoration:none;font-size:15px;white-space:nowrap}
nav.main a[aria-current="page"]{color:var(--blue);background:var(--soft);font-weight:600}
.langs{display:flex;flex-shrink:0;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.langs button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:13px;font-weight:600;padding:7px 9px;min-width:40px;min-height:36px;cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--blue);color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--blue);color:#fff;border:1px solid var(--blue);border-radius:6px;padding:11px 20px;font:inherit;font-weight:600;text-decoration:none;cursor:pointer;min-height:44px}
.btn:hover{background:var(--blue-d);border-color:var(--blue-d)}
.btn.line{background:transparent;color:var(--blue)}
.btn.line:hover{background:var(--soft)}
.btn.light{background:#fff;color:#145A86;border-color:#fff}
.btn.ghost-light{background:transparent;color:#fff;border-color:rgba(255,255,255,.8)}
.burger{display:none;margin-left:auto;flex-shrink:0;background:transparent;border:1px solid var(--line);border-radius:6px;width:44px;height:44px;color:var(--ink);cursor:pointer}
.head-cta{white-space:nowrap}
@media (max-width:520px){
  .wrap{padding:0 16px}
  header.site .wrap{gap:10px}
  .logo{font-size:14px}
  .logo small{display:none}
  .langs button{min-width:34px;padding:7px 6px}
}
@media (max-width:1400px){
  nav.main{display:none}
  .langs{margin-left:auto}
  .burger{margin-left:0}
  .burger{display:inline-grid;place-items:center}
  nav.main.open{display:flex;flex-direction:column;position:absolute;left:0;right:0;top:100%;background:var(--surface);border-bottom:1px solid var(--line);padding:8px 16px 16px;gap:2px}
  nav.main.open a{padding:12px}
}

/* hero */
.hero{position:relative;color:#fff;overflow:hidden;background:#123B55}
.hero .art{position:absolute;inset:0}
.hero .art svg{width:100%;height:100%;display:block}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(9,32,47,.78) 0%,rgba(9,32,47,.45) 45%,rgba(9,32,47,0) 75%)}
.hero h1,.hero p{text-shadow:0 2px 12px rgba(0,0,0,.25)}
.hero .wrap{position:relative;z-index:1;padding-top:96px;padding-bottom:104px}
.hero h1{font-size:clamp(32px,5vw,56px);line-height:1.08;margin:0 0 18px;max-width:15ch;font-weight:700;letter-spacing:-.02em}
.hero p{font-size:clamp(17px,2vw,21px);max-width:44ch;margin:0 0 30px;color:#E6F0F5}
.hero .actions{display:flex;flex-wrap:wrap;gap:12px}
.hero .credit{position:absolute;right:16px;bottom:12px;z-index:1;font-size:12px;color:#CFE0EA}

/* page heads */
.phead{background:var(--surface);border-bottom:1px solid var(--line)}
.phead .wrap{padding-top:52px;padding-bottom:40px}
.phead h1{font-size:clamp(30px,4vw,44px);line-height:1.12;margin:0 0 14px;letter-spacing:-.015em}
.phead p{font-size:18px;color:var(--muted);max-width:62ch;margin:0}
section.block{padding:56px 0}
h2{font-size:clamp(24px,3vw,32px);line-height:1.2;margin:0 0 16px;letter-spacing:-.01em}
h3{font-size:20px;line-height:1.3;margin:0 0 10px}
.prose{max-width:66ch}
.prose p{margin:0 0 14px}
.muted{color:var(--muted)}

/* chips nav */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:24px}
.chips a{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border:1px solid var(--line);border-radius:22px;text-decoration:none;color:var(--ink);background:var(--surface);font-size:15px;min-height:40px}
.chips a:hover{border-color:var(--blue);color:var(--blue)}
.chips svg{width:18px;height:18px;color:var(--cat)}
.chips a{border-left:4px solid var(--cat)}

/* figure placeholder */
figure.ph{margin:0;position:relative;border-radius:12px;overflow:hidden;background:#DDF3FC;box-shadow:0 10px 30px -18px rgba(20,90,134,.6)}
figure.ph svg{display:block;width:100%;height:auto;aspect-ratio:4/3}
figure.ph figcaption{position:absolute;left:10px;bottom:10px;max-width:calc(100% - 20px);background:rgba(255,255,255,.9);color:#23313A;font-size:12.5px;line-height:1.3;padding:5px 10px;border-radius:14px;backdrop-filter:blur(4px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) figure.ph figcaption{background:rgba(14,26,33,.9);color:#E3ECF0}}
:root[data-theme="dark"] figure.ph figcaption{background:rgba(14,26,33,.9);color:#E3ECF0}

/* solutions */
.sol{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:40px;align-items:start;padding:48px 0;border-top:1px solid var(--line)}
.sol:nth-of-type(even) .sol-media{order:-1}
.sol-num{display:flex;align-items:center;gap:12px;color:var(--green);font-weight:700;margin-bottom:10px}
.sol-num .ic{width:48px;height:48px;border-radius:12px;background:var(--cat);color:#fff;display:grid;place-items:center;box-shadow:0 6px 14px -6px var(--cat)}
.sol-num{color:var(--cat)!important}
.sol-num .ic svg{width:26px;height:26px}
.links{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.smart{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:28px;margin-top:28px}
.smart-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;margin-top:16px}
.smart-grid div{border-top:4px solid #7C5CD6;padding-top:12px}
.smart-grid b{display:block;margin-bottom:4px}
@media (max-width:860px){.sol{grid-template-columns:1fr;gap:20px}.sol:nth-of-type(even) .sol-media{order:0}.smart-grid{grid-template-columns:1fr 1fr}}
@media (max-width:480px){.smart-grid{grid-template-columns:1fr}}

/* cards grid */
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
@media (max-width:900px){.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.grid3{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--cat,var(--blue));border-radius:10px;padding:22px;display:flex;flex-direction:column;gap:10px}
.card .go{margin-top:auto;font-weight:600;text-decoration:none}
.brand-logo{height:96px;border:1px dashed var(--line);border-radius:8px;display:grid;place-items:center;color:var(--muted);font-size:13px;text-align:center;padding:8px}
.brand-logo b{display:block;font-size:22px;color:var(--ink);letter-spacing:.02em}
.ext{display:inline-flex;align-items:center;gap:6px;font-weight:600;text-decoration:none}
.ext svg{width:15px;height:15px}
.help{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;background:var(--soft);border-radius:10px;padding:26px 28px;margin-top:32px}
.help h3{margin:0}

/* turnkey */
.stages{list-style:none;margin:0;padding:0}
.stage{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:32px;padding:36px 0;border-top:1px solid var(--line);align-items:start}
.stage:nth-child(even) .stage-media{order:-1}
.stage.nophoto{grid-template-columns:1fr}
.stage-head{display:flex;align-items:center;gap:14px;margin-bottom:10px}
.stage-no{font-size:30px;font-weight:700;color:var(--blue);line-height:1;min-width:46px}
.stage-ic{width:48px;height:48px;border-radius:12px;background:linear-gradient(135deg,#1F8FD1,#145A86);display:grid;place-items:center;color:#fff}
.stage:nth-child(even) .stage-ic{background:linear-gradient(135deg,#43A564,#2B7A4B)}
.stage-ic svg{width:26px;height:26px}
.result{margin-top:12px;padding:10px 14px;border-left:3px solid var(--green);background:var(--leaf);border-radius:0 6px 6px 0;font-size:15px}
.toggle-photos{display:flex;align-items:center;gap:10px;margin-top:22px;font-size:15px;color:var(--muted)}
.toggle-photos input{width:20px;height:20px}
@media (max-width:860px){.stage{grid-template-columns:1fr;gap:16px}.stage:nth-child(even) .stage-media{order:0}}

/* gallery */
.gal-sec{padding:40px 0;border-top:1px solid var(--line)}
.gal-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px 20px;margin-bottom:16px}
.gal-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:900px){.gal-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:420px){.gal-grid{grid-template-columns:1fr}}
.gal-grid button{padding:0;border:0;background:none;cursor:zoom-in;border-radius:8px;text-align:left}
dialog.lb{border:0;padding:0;background:transparent;max-width:min(1000px,94vw);width:94vw;color:#fff}
dialog.lb::backdrop{background:rgba(6,18,26,.9)}
.lb-inner{position:relative}
.lb-inner figure.ph svg{aspect-ratio:4/3}
.lb-cap{margin-top:12px;font-size:15px;display:flex;justify-content:space-between;gap:16px}
.lb-btn{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;border:0;background:rgba(255,255,255,.9);color:#145A86;font-size:22px;cursor:pointer}
.lb-prev{left:8px}.lb-next{right:8px}
.lb-close{position:absolute;top:8px;right:8px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.9);color:#145A86;font-size:22px;cursor:pointer;z-index:2}

/* contact */
.contact-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:40px;align-items:start}
@media (max-width:860px){.contact-grid{grid-template-columns:1fr}}
dl.cdata{margin:0;display:grid;grid-template-columns:auto 1fr;gap:10px 18px}
dl.cdata dt{color:var(--muted);font-size:14px}
dl.cdata dd{margin:0}
.todo{border-bottom:1px dashed var(--muted);color:var(--muted)}
.map{margin-top:20px;height:200px;border:1px dashed var(--line);border-radius:8px;display:grid;place-items:center;color:var(--muted);font-size:14px;text-align:center;padding:10px}
form.lead{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:26px}
.f{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.f label{font-weight:600;font-size:15px}
.f .hint{font-size:13px;color:var(--muted);font-weight:400}
.f input,.f select,.f textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:11px 12px;min-height:46px;width:100%}
.f textarea{min-height:130px;resize:vertical}
.f.bad input,.f.bad textarea{border-color:var(--warn)}
.err{color:var(--warn);font-size:14px;min-height:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
@media (max-width:560px){.two{grid-template-columns:1fr}}
.counter{font-size:13px;color:var(--muted);text-align:right}
.ok{background:var(--leaf);border-radius:10px;padding:24px}
.ok pre{white-space:pre-wrap;font-size:13px;background:var(--surface);border-radius:6px;padding:12px;overflow-x:auto}

/* about extras */
.split{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:44px;align-items:center}
@media (max-width:860px){.split{grid-template-columns:1fr;gap:24px}}
.brands-line{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.brands-line span{padding:4px 10px;border:1px solid var(--line);border-radius:4px;font-size:14px;background:var(--surface)}
.cta-band{background:var(--blue);color:#fff}
.cta-band .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:20px;padding-top:40px;padding-bottom:40px}
.cta-band h2{margin:0;color:#fff}

footer{background:var(--surface);border-top:1px solid var(--line);padding:28px 0;color:var(--muted);font-size:14px}
footer .wrap{display:flex;flex-wrap:wrap;gap:12px 28px;justify-content:space-between}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:8px;font-size:15px;z-index:40;max-width:90vw}
.view[hidden]{display:none}
/* v14: birdsong toggle */
.sound-btn{position:absolute;z-index:3;left:clamp(12px,1.6vw,24px);bottom:calc(18px + env(safe-area-inset-bottom,0px));display:inline-flex;align-items:center;gap:8px;
  min-height:44px;padding:10px 16px;border-radius:24px;border:1px solid rgba(29,90,133,.18);background:rgba(255,255,255,.82);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  color:#1d5a85;font:600 15px/1 "Noto Sans",system-ui,sans-serif;cursor:pointer;box-shadow:0 10px 24px -14px rgba(20,40,60,.6)}
.sound-btn:hover{background:#fff}
.sound-btn[aria-pressed="false"]{background:#1d5a85;color:#fff;border-color:#1d5a85}
@media (max-width:520px){.sound-btn span{display:none}.sound-btn{padding:10px 12px}}

/* v13: top menu as in the uploaded menu file (isx), with the framed pair on the right */
.isx-header{--isx-blue:#1d5a85;--isx-blue-dark:#164a6e;--isx-ink:#1f2a33;--isx-muted:#6b7780;--isx-active-bg:#e7eef3;--isx-border:#d5dde3;
  position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:#fff;border-bottom:1px solid #e6ebef;font-family:"Noto Sans","Noto Sans Georgian",system-ui,sans-serif}
.isx-wrap{max-width:1440px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:24px;position:relative}
.isx-brand{display:flex;align-items:center;gap:14px;text-decoration:none;flex-shrink:0}
.isx-logo{width:44px;height:44px;border-radius:10px;background:var(--isx-blue);display:grid;place-items:center}
.isx-logo svg{width:24px;height:28px}
.isx-name{display:flex;flex-direction:column;line-height:1.1}
.isx-name b{font-size:21px;font-weight:700;color:var(--isx-ink);letter-spacing:-.2px}
.isx-name span{font-size:13px;color:var(--isx-muted);margin-top:4px}
.isx-nav{display:flex;align-items:center;gap:4px;margin-left:8px}
.isx-nav a{padding:10px 16px;border-radius:10px;font-size:17px;font-weight:500;color:var(--isx-ink);text-decoration:none;white-space:nowrap;transition:background .15s,color .15s}
.isx-nav a:hover{background:#f1f5f8}
.isx-nav a[aria-current="page"]{background:var(--isx-active-bg);color:var(--isx-blue)}
.isx-right{margin-left:auto;display:flex;align-items:center;gap:28px}
.isx-lang{display:flex;border:1px solid var(--isx-border);border-radius:8px;overflow:hidden}
.isx-lang button{border:0;background:#fff;padding:9px 15px;font:600 15px/1 "Noto Sans",system-ui,sans-serif;color:var(--isx-muted);cursor:pointer;min-height:40px}
.isx-lang button:hover{color:var(--isx-ink)}
.isx-lang button.is-active{background:var(--isx-blue);color:#fff}
.isx-pair{display:flex;gap:8px;padding:5px;border-radius:14px;background:linear-gradient(135deg,#E6F2E8,#EEF5F9);box-shadow:0 10px 24px -16px rgba(20,60,40,.55),inset 0 0 0 1px rgba(29,90,133,.10)}
.isx-cta{background:var(--isx-blue);color:#fff;text-decoration:none;font-size:17px;font-weight:600;padding:12px 24px;border-radius:8px;white-space:nowrap;border:1px solid var(--isx-blue);transition:background .15s}
.isx-cta:hover{background:var(--isx-blue-dark)}
.isx-cta-line{background:rgba(255,255,255,.7);color:var(--isx-blue)}
.isx-cta-line:hover{background:#fff;color:var(--isx-blue-dark)}
.isx-burger{display:none;margin-left:auto;width:44px;height:44px;border:1px solid var(--isx-border);border-radius:8px;background:#fff;cursor:pointer;align-items:center;justify-content:center}
.isx-burger span,.isx-burger span::before,.isx-burger span::after{display:block;width:20px;height:2px;background:var(--isx-ink);position:relative;transition:.2s}
.isx-burger span::before,.isx-burger span::after{content:"";position:absolute;left:0}
.isx-burger span::before{top:-6px}.isx-burger span::after{top:6px}
.isx-header.is-open .isx-burger span{background:transparent}
.isx-header.is-open .isx-burger span::before{top:0;transform:rotate(45deg)}
.isx-header.is-open .isx-burger span::after{top:0;transform:rotate(-45deg)}
/* fluid sizes so the whole menu + pair fit in one row from 1120 px */
.isx-wrap{gap:clamp(6px,1vw,24px);padding:12px clamp(10px,1.3vw,24px)}
.isx-brand{gap:clamp(8px,.9vw,14px)}
.isx-logo{width:clamp(38px,3vw,44px);height:clamp(38px,3vw,44px)}
.isx-name b{font-size:clamp(15px,1.2vw,21px)}
.isx-nav{margin-left:clamp(0px,.5vw,8px);gap:clamp(0px,.25vw,4px)}
.isx-nav a{font-size:clamp(13.5px,1vw,17px);padding:9px clamp(4px,.62vw,16px)}
.isx-right{gap:clamp(6px,1.1vw,28px)}
.isx-lang button{padding:9px clamp(5px,.7vw,15px);font-size:clamp(13px,.9vw,15px)}
.isx-pair{gap:clamp(4px,.4vw,8px)}
.isx-cta{font-size:clamp(13.5px,1vw,17px);padding:clamp(8px,.7vw,12px) clamp(8px,1.05vw,24px)}
@media (max-width:1148px){
  .isx-burger{display:flex;order:2}
  .isx-nav,.isx-right{order:3;display:none}
  .isx-header.is-open .isx-wrap{flex-wrap:wrap}

const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function initPeople(){
  PEOPLE = [];

    const host = document.getElementById('ppRow' + c.row); if (!host) return;
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.innerHTML = personSVG(c); host.appendChild(g);
    const q = r => g.querySelector(`[data-r="${r}"]`);
    const [y, s] = ROWS_Y[c.row];
    const d1 = Math.abs(c.wx - c.sx) / c.v, d2 = d1 + c.work, d3 = d2 + Math.abs(c.ex - c.wx) / c.v;
    PEOPLE.push({c, g, y: y + 11*s, legF:q('legF'), legB:q('legB'), torso:q('torso'), armF:q('armF'), armB:q('armB'), d1, d2, d3, cycle: d3 + c.idle, dir: c.ex > c.sx ? 1 : -1});
  });

function rot(el, a, cx, cy){ el.setAttribute('transform', `rotate(${a.toFixed(1)} ${cx} ${cy})`); }
function pose(P, x, phase, walking, wt){
  const c = P.c; let lf = 0, lb = 0, af = 0, ab = 0, tr = 0, bob = 0;

  else if (c.kind === 'hoe') { const h = Math.sin(wt * 2); tr = 14 + h * 6; af = -38 + h * 42; ab = -30 + h * 40; lf = 14; lb = -12; }
  else if (c.kind === 'agro') { tr = 4 + Math.sin(wt * 1.4) * 4; af = -72; ab = -58; lf = 6; lb = -6; }
  if (c.kind === 'carrier') af = -172;
  if (c.kind === 'agro' && walking) af = -60 + Math.sin(phase) * 6;
  P.g.setAttribute('transform', `translate(${x.toFixed(1)} ${(P.y + bob).toFixed(1)}) scale(${P.dir * c.k} ${c.k})`);
  rot(P.legF, lf, 0, -26); rot(P.legB, lb, 0, -26); rot(P.torso, tr, 0, -26); rot(P.armF, af, 0, -46); rot(P.armB, ab, 0, -46);
}
function peopleTick(now){
  if (!reduceMotion && PEOPLE.length && PEOPLE[0].g.isConnected) {
    const t = now / 1000;
    PEOPLE.forEach(P => {
      const c = P.c, T = (t + c.off) % P.cycle;
      if (T < P.d1) { const dist = c.v * T; pose(P, c.sx + P.dir * dist, dist * .2, true, 0); }
      else if (T < P.d2) pose(P, c.wx, 0, false, T - P.d1);
      else if (T < P.d3) { const dist = c.v * (T - P.d2); pose(P, c.wx + P.dir * dist, dist * .2, true, 0); }
      else pose(P, c.ex, 0, true, 0);

}

/* ---------- v15: birdsong ON by default; browsers allow audio only after the first click/tap/key ---------- */
const Birdsong = (() => {
  let ac = null, master = null, timer = null, playing = false;
  let wanted = true;
  try { if (localStorage.getItem('isl-birds') === 'off') wanted = false; } catch (e) {}
  function ctx(){
    if (!ac) {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null;
      ac = new AC();
      const comp = ac.createDynamicsCompressor(); comp.connect(ac.destination);
      master = ac.createGain(); master.gain.value = 0; master.connect(comp);
    }
    return ac;
  }
  function note(t, f0, f1, dur, vol, pan, opts){
    opts = opts || {};
    const o = ac.createOscillator(), g = ac.createGain(), p = ac.createStereoPanner ? ac.createStereoPanner() : null;
    o.type = opts.type || 'sine';
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(f1, 40), t + dur);
    if (opts.fm) { const l = ac.createOscillator(), lg = ac.createGain(); l.frequency.value = opts.fm; lg.gain.value = opts.fmDepth || 150; l.connect(lg); lg.connect(o.frequency); l.start(t); l.stop(t + dur + .02); }
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + Math.min(.012, dur * .3));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    let out = g;
    if (opts.band) { const b = ac.createBiquadFilter(); b.type = 'bandpass'; b.frequency.value = opts.band; b.Q.value = 3; g.connect(b); out = b; }
    o.connect(g);
    if (p) { p.pan.value = pan; out.connect(p); p.connect(master); } else out.connect(master);
    o.start(t); o.stop(t + dur + .03);
  }
  const R = (a, b) => a + Math.random() * (b - a);
  const SONGS = [
    (t, pan) => { const n = 2 + (Math.random() * 3 | 0); for (let i = 0; i < n; i++) note(t + i * .19, R(2300, 2600), R(1900, 2100), .13, .35, pan, {fm: 38, fmDepth: 220}); },
    (t, pan) => { const b = R(1150, 1350); note(t, b, b * 1.3, .16, .4, pan); note(t + .2, b * 1.35, b * 1.15, .18, .38, pan); note(t + .42, b * .9, b * 1.12, .24, .36, pan); },
    (t, pan) => { const n = 8 + (Math.random() * 6 | 0), f = R(3600, 4400); for (let i = 0; i < n; i++) note(t + i * .055, f * (1 - i * .012), f * .88, .045, .22, pan); note(t + n * .055 + .05, f * .7, f * 1.05, .12, .25, pan); },
    (t, pan) => { const hi = R(3600, 4000), lo = hi * .74; for (let i = 0; i < 3; i++) { note(t + i * .3, hi, hi * .97, .08, .3, pan); note(t + i * .3 + .12, lo, lo * .96, .1, .3, pan); } },
    (t, pan) => { let tt = t; for (let i = 0; i < 6; i++) { const f = R(2400, 4800), d = R(.05, .12); note(tt, f, f * R(.8, 1.25), d, .2, pan); tt += d + R(.02, .06); } },
    (t, pan) => { for (let i = 0; i < 2; i++) note(t + i * .16, R(900, 1100), R(1300, 1500), .1, .12, pan, {type: 'sawtooth', band: 1400}); }
  ];
  function loop(){
    if (!playing) return;
    if (ac.state === 'running') {
      const t = ac.currentTime + .05;
      const k = Math.random() < .08 ? 5 : Math.random() * 5 | 0;
      SONGS[k](t, R(-.85, .85));
      if (Math.random() < .3) SONGS[Math.random() * 5 | 0](t + R(.3, .9), R(-.85, .85));
    }
    timer = setTimeout(loop, R(900, 3200));
  }
  let suspendTimer = null;
  function play(){
    if (!wanted || playing || !ctx()) return;
    playing = true; clearTimeout(suspendTimer); ac.resume().catch(() => {});
    master.gain.cancelScheduledValues(0);
    master.gain.setValueAtTime(0, ac.currentTime);
    master.gain.linearRampToValueAtTime(.16, ac.currentTime + .8);
    /* v22: water sound removed completely (code too) — birds only */
    clearTimeout(timer); loop();
  }
  function pause(){
    playing = false; clearTimeout(timer);
    if (ac) {
      /* v20: mute at once and then stop the audio engine completely — works the same in Chrome, Safari and Firefox */
      master.gain.cancelScheduledValues(0);
      master.gain.setValueAtTime(0, ac.currentTime);
      master.gain.value = 0;
      clearTimeout(suspendTimer);
      suspendTimer = setTimeout(() => { if (!playing && ac.state === 'running') ac.suspend().catch(() => {}); }, 150);
    }
  }
  function setWanted(v){ wanted = v; try { localStorage.setItem('isl-birds', v ? 'on' : 'off'); } catch (e) {} }
  // first gesture anywhere on the page unlocks audio (browser autoplay rule)
  const unlock = () => { if (ac && playing && wanted && ac.state !== 'running') ac.resume().catch(() => {}); };
  ['pointerdown','keydown','touchend'].forEach(ev => document.addEventListener(ev, unlock, {capture:true, passive:true}));
  document.addEventListener('visibilitychange', () => { if (!ac) return; if (document.hidden) ac.suspend().catch(() => {}); else if (playing && wanted) ac.resume().catch(() => {}); });
  return { play, pause, setWanted, get wanted(){ return wanted; }, get playing(){ return playing; } };
})();
const SPK_ON = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
const SPK_OFF = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>';
function soundInner(){ const x = t(); return (Birdsong.wanted ? SPK_ON : SPK_OFF) + `<span>${esc(x.soundLbl)}</span>`; }
function soundBtnHTML(){ const x = t(); return `<button class="sound-btn" id="soundBtn" type="button" aria-pressed="${Birdsong.wanted}" aria-label="${esc(Birdsong.wanted ? x.birdsOff : x.birdsOn)}" title="${esc(Birdsong.wanted ? x.birdsOff : x.birdsOn)}">${soundInner()}</button>`; }
function bindSound(){
  const b = document.getElementById('soundBtn'); if (!b) return;
  Birdsong.play();
  b.addEventListener('pointerdown', e => e.stopPropagation(), true);
  b.addEventListener('click', e => {
    e.stopPropagation();
    if (Birdsong.wanted) { Birdsong.setWanted(false); Birdsong.pause(); }
    else { Birdsong.setWanted(true); Birdsong.play(); }
    b.setAttribute('aria-pressed', String(Birdsong.wanted)); b.innerHTML = soundInner(); const lbl = Birdsong.wanted ? t().birdsOff : t().birdsOn; b.setAttribute('aria-label', lbl); b.title = lbl;
  });
}

function route(){

  let view = parts[0], sub = parts.slice(1).join('-');
  if (!VIEWS[view]) { view = 'about'; sub = ''; }
  if (view === 'contact') formTopic = sub || formTopic;
  chrome(view);
  document.getElementById('app').innerHTML = VIEWS[view]();
  document.getElementById('isxHeader').classList.remove('is-open');
  document.getElementById('burger').setAttribute('aria-expanded','false');
  document.title = 'Irrigation Systems LLC — ' + (t().nav[view] || t().privH) + ' (v22)';
  bind(view);
  if (view === 'about') { initPeople(); bindSound(); } else Birdsong.pause();
  const target = sub && (view === 'solutions' ? document.getElementById('sol-' + sub) : view === 'gallery' ? document.getElementById('gal-' + sub) : null);
  if (target) { requestAnimationFrame(() => target.scrollIntoView({block:'start'})); }
  else window.scrollTo(0, 0);
  if (view === 'gallery' && sub) track('gallery_open', {category: sub});
}

/* ---------- analytics stub (no personal data) ---------- */
const events = [];
function track(name, p){ events.push(Object.assign({event:name, language:lang, page_path:location.hash || '#about'}, p)); }

/* ---------- behaviour ---------- */
function bind(view){
  if (view === 'turnkey') document.getElementById('hidePh').addEventListener('change', e => { hidePhotos = e.target.checked; route(); });
  if (view === 'gallery') document.querySelectorAll('.gal-grid button').forEach(b => b.addEventListener('click', () => openLb(b.dataset.cat, +b.dataset.i)));
  if (view === 'products') document.querySelectorAll('[data-supplier]').forEach(a => a.addEventListener('click', () => track('supplier_click', {brand:a.dataset.supplier})));
  if (view === 'contact') bindForm();
}

function bindForm(){
  const x = t(), F = document.getElementById('leadForm');
  const msg = document.getElementById('i-msg'), cnt = document.getElementById('cnt');
  msg.addEventListener('input', () => cnt.textContent = msg.value.length);
  let sending = false;
  F.addEventListener('submit', e => {
    e.preventDefault(); if (sending) return;
    const v = id => document.getElementById(id).value.trim();
    const setErr = (fid, text) => { const box = document.getElementById(fid); box.classList.toggle('bad', !!text); box.querySelector('.err').textContent = text || ''; };
    let ok = true;
    const name = v('i-name'), contact = v('i-contact'), m = v('i-msg');
    setErr('f-name', name ? '' : x.e.name); ok = ok && !!name;
    let cErr = '';
    if (!contact) cErr = x.e.contact;
    else if (contact.includes('@')) { if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(contact)) cErr = x.e.email; }
    else if (!/^\+?[0-9\s()\-]{7,20}$/.test(contact)) cErr = x.e.phone;
    setErr('f-contact', cErr); ok = ok && !cErr;
    const mErr = !m ? x.e.msg : (m.length > 2000 ? x.e.long : '');
    setErr('f-msg', mErr); ok = ok && !mErr;
    if (!ok) { F.querySelector('.bad input, .bad textarea').focus(); return; }
    sending = true; document.getElementById('sendBtn').disabled = true;
    setTimeout(() => {
      track('generate_lead', {topic: v('i-topic') || 'none'});
      const rec = { date: new Date().toISOString(), language: lang, topic: v('i-topic') || '—', name, company: v('i-company') || '—', contact, message: m, source_page: '/' + lang + '/contact/' };
      document.getElementById('formBox').innerHTML = `<div class="ok" role="status"><h2 style="font-size:24px">${esc(x.okH)}</h2><p>${esc(x.okP)}</p><p class="muted" style="font-size:14px">${esc(x.okDemo)}</p><pre>${esc(JSON.stringify(rec, null, 2))}</pre><button class="btn line" id="againBtn">${esc(x.again)}</button></div>`;
      document.getElementById('againBtn').addEventListener('click', () => route());
    }, 600);
  });
}

/* lightbox */
const lb = document.getElementById('lb'); let lbCat = '', lbI = 0;
function drawLb(){
  const x = t();
  document.getElementById('lbFig').innerHTML = fig(lbCat, lbI, x.galPh + ' ' + (lbI+1));
  document.getElementById('lbCap').textContent = x.sol[lbCat][0];
  document.getElementById('lbCount').textContent = (lbI+1) + ' / 3';
}
function openLb(cat, i){ lbCat = cat; lbI = i; drawLb(); if (typeof lb.showModal === 'function') lb.showModal(); else lb.setAttribute('open',''); track('gallery_open', {category: cat}); }
function step(d){ lbI = (lbI + d + 3) % 3; drawLb(); }
document.getElementById('lbPrev').addEventListener('click', () => step(-1));
document.getElementById('lbNext').addEventListener('click', () => step(1));
document.getElementById('lbClose').addEventListener('click', () => lb.close());
lb.addEventListener('click', e => { if (e.target === lb) lb.close(); });
lb.addEventListener('keydown', e => { if (e.key === 'ArrowLeft') step(-1); if (e.key === 'ArrowRight') step(1); });
let tx = null;
lb.addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, {passive:true});
lb.addEventListener('touchend', e => { if (tx === null) return; const dx = e.changedTouches[0].clientX - tx; if (Math.abs(dx) > 40) step(dx < 0 ? 1 : -1); tx = null; });

/* language */
let toastT;
function toast(msg){ let el = document.querySelector('.toast'); if (!el) { el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role','status'); document.body.appendChild(el); } el.textContent = msg; clearTimeout(toastT); toastT = setTimeout(() => el.remove(), 3500); }
document.querySelectorAll('.isx-lang button').forEach(b => b.addEventListener('click', () => {
  if (b.dataset.lang === 'ka') { toast(t().kaNote); return; }
  lang = b.dataset.lang; try { localStorage.setItem('isl-proto-lang', lang); } catch (e) {}
  const y = window.scrollY; route(); if (!location.hash.includes('-')) window.scrollTo(0, y);
}));
document.getElementById('burger').addEventListener('click', () => {
  const h = document.getElementById('isxHeader'); const open = h.classList.toggle('is-open');
  document.getElementById('burger').setAttribute('aria-expanded', open ? 'true' : 'false');
});
document.addEventListener('click', e => { const a = e.target.closest('a[href^="tel:"],a[href^="mailto:"]'); if (a) track('contact_click', {channel: a.href.split(':')[0]}); });

window.addEventListener('hashchange', route);
route();
</script>
