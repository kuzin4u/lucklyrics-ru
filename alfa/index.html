 const m=r[0];const name=codes.includes('47.91')?'Селлер маркетплейсов':m[3].includes('abroad')?'Работает на внешний рынок':c.ok==='10.71'?'Производитель со своей розницей':m[4].includes('лицензи')?'Лицензируемые услуги населению':m[1].includes('B2C')?'Розница и услуги: оплата здесь и сейчас':m[1].includes('гос')?'Подрядчик под крупные заказы':m[1].includes('B2B')?'B2B-бизнес с платежами по счетам':'Новый бизнес';
 return{codes,r,model,tags,name}}
let prof={};
const P=c=>prof[c.id]||(prof[c.id]=new Set());
function portrait(c){const p=P(c),d=days(c),one=c.f==='ИП'||c.own==='1 участник';
 const oa=okAnalysis(c);
 const auto=[...oa.model,d<=7?'Первые дни бизнеса':'Первый месяц бизнеса',c.f==='ИП'?'Работает сам, решения принимает один':(one?'Один владелец — он же руководитель':'Партнёрский бизнес — решают вместе')];
 const g=['fast','save','growth','mp','abroad','team'].find(k=>p.has(k));
 const name=oa.name+(g?' · '+OBR[g].toLowerCase():'');
 const how=[];if(p.has('online'))how.push('Онлайн-заявка и подпись УКЭП, без визита');if(p.has('manager'))how.push('Закрепить личного менеджера и дать прямой контакт');if(p.has('busy'))how.push('Коротко: три довода и сразу ссылка на заявку');if(p.has('detail'))how.push('Показать тарифы и условия целиком');
 const ch=[['msg','мессенджер'],['call','звонок в оговорённое время'],['mail','e-mail']].filter(x=>p.has(x[0])).map(x=>x[1]);if(ch.length)how.push('Связь: '+ch.join(', '));
 const not=['Кредит — до 3–6 месяцев оборотов'];if(p.has('save'))not.unshift('Платные тарифы, пока нет оборотов');if(!p.has('team')&&!oa.tags.has('team'))not.push('Зарплатный проект — пока нет сотрудников');if(!p.has('abroad')&&!oa.tags.has('abroad'))not.push('ВЭД — по ОКВЭД нет признаков');
 return{auto,name,how,not,filled:p.size,oa}}
function sorted(c){const p=P(c),t=okAnalysis(c).tags;return [...SEGA[c.seg],...BASE].map(a=>[a,a[3].split(' ').reduce((s,x)=>s+(p.has(x)?2:0)+(t.has(x)?1:0),0)]).sort((x,y)=>y[1]-x[1]).map(x=>x[0]).slice(0,5)}
const OBJ={'Уже открыли счёт в другом банке':'Второй счёт ничего не стоит при отсутствии оборотов — это резерв на случай блокировки и отдельный счёт под налоги или эквайринг.','Пока нет оборотов':'Именно поэтому — «Простой»: без оборотов обслуживание 0 ₽, а реквизиты уже будут на руках.','Некогда ехать в банк':'Заявка онлайн, документы подписываются на встрече с менеджером в удобном месте.'};
const days=c=>Math.round((TODAY-c.d)/864e5);
const prio=c=>c.flag?0:Math.max(10,Math.min(99,100-days(c)*4-(c.f==='ИП'?5:0)+(SEGA[c.seg].length*3)));
let res=[],cur=null,mark={};
function search(e){e&&e.preventDefault();const q=$('#q').value.trim().toLowerCase(),per=+$('#per').value,f=$('#frm').value,r=$('#reg').value,ind=$('#ind').value;
 res=C.filter(c=>days(c)<=per&&(!f||c.f===f)&&(!r||c.reg===r)&&(!ind||c.seg===ind)&&(!q||[c.n,c.inn,c.ogrn,c.boss,c.okn].join(' ').toLowerCase().includes(q))).sort((a,b)=>prio(b)-prio(a));
 $('#cnt').textContent=res.length?`Найдено: ${res.length}. Сначала самые свежие и перспективные.`:'Ничего не найдено — расширьте период или уберите фильтр.';
 if(!res.find(c=>c.id===cur))cur=res[0]?.id||null;list();card()}
function list(){$('#list').innerHTML=res.map(c=>`<button class="it${c.id===cur?' sel':''}" data-id="${c.id}"><span>${c.n}<small>${c.ok} · ${c.okn} · ${days(c)} дн. назад</small>${c.flag?`<span class="tag r">${c.flag}</span>`:`<span class="tag">${IND[c.seg]}</span>`}${mark[c.id]?'<span class="tag w">В работе</span>':''}</span><span class="pr">${prio(c)}</span></button>`).join('')}
function card(){const c=C.find(x=>x.id===cur);if(!c){$('#cd').innerHTML='<p class="mut">Нет выбранной компании.</p>';return}
 const A=c.flag?[]:sorted(c),pt=portrait(c),p=P(c);
 $('#cd').innerHTML=`<h2>${c.n}</h2><span class="mut">Зарегистрирована ${c.d.toLocaleDateString('ru-RU')} — ${days(c)} дн. назад · ${c.reg}</span>
 <div class="facts">${[['ИНН',c.inn],[c.f==='ИП'?'ОГРНИП':'ОГРН',c.ogrn],['Руководитель',c.boss],['Участники',c.own],['Капитал',c.cap],['ОКВЭД',c.ok+' '+c.okn],['Доп. ОКВЭД',c.add.join(', ')||'—']].map(x=>`<div class="fa"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div>
 ${c.flag?`<div class="stop"><b>Не привлекать: ${c.flag}.</b> Нужна проверка службой безопасности.</div>`:`<div class="pt"><div class="pth"><span class="mut">Образ клиента — по ОКВЭД и со слов клиента</span><b>${pt.name}</b></div>
 <div class="scroll" style="margin-top:8px"><table class="okt"><thead><tr><th>ОКВЭД</th><th>Деятельность</th><th>Клиенты</th><th>Платежи</th><th>Особенность</th></tr></thead><tbody>${pt.oa.codes.map((k,i)=>{const x=pt.oa.r[i];return `<tr><td class="nw"><b>${k}</b>${i?'':' <span class="tag">осн.</span>'}</td><td>${x[0]}</td><td>${x[1]}</td><td>${x[2]}</td><td>${x[4]}</td></tr>`}).join('')}</tbody></table></div>
 <div class="ptc"><div><h4>Выводы по ОКВЭД</h4>${pt.auto.map(x=>`<div>• ${x}</div>`).join('')}</div><div><h4>Как работать</h4>${pt.how.length?pt.how.map(x=>`<div>• ${x}</div>`).join(''):'<div class="mut">Отметьте ниже, что клиент рассказал о себе</div>'}</div><div><h4>Не предлагать сейчас</h4>${pt.not.map(x=>`<div>• ${x}</div>`).join('')}</div></div>
 <h3>Со слов клиента</h3>${INT.map(([g,xs])=>`<div class="grp"><span class="mut">${g}</span>${xs.map(([k,t])=>`<button class="chip${p.has(k)?' on':''}" data-k="${k}" aria-pressed="${p.has(k)}">${t}</button>`).join('')}</div>`).join('')}
 <p class="mut" style="margin:4px 0 0">Отмечайте только то, что клиент сказал сам. Аргументы ниже перестраиваются под отметки.</p></div>
 <h3>Аргументы для разговора${pt.filled?' — под интересы клиента':''}</h3>${A.map((a,i)=>`<div class="arg"><span class="n">${i+1}</span><div><b>${a[0]}</b><div class="why">${a[1]}</div><div class="off">→ ${a[2]}</div></div></div>`).join('')}
 <h3>Если клиент возражает</h3>${Object.entries(OBJ).map(([k,v])=>`<div class="obj"><b>«${k}»</b>${v}</div>`).join('')}`}
 <div class="acts">${c.flag?'':`<button id="mk" class="${mark[c.id]?'on':''}">${mark[c.id]?'✓ В работе':'Взять в работу'}</button><button class="ghost" id="cp">Скопировать аргументы</button>`}<a class="lnk" href="https://egrul.nalog.ru/index.html" target="_blank" rel="noopener">Проверить в ЕГРЮЛ ↗</a><span class="mut" id="cpm"></span></div>`;
 $('#cd').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{const k=b.dataset.k;p.has(k)?p.delete(k):p.add(k);card()});
 const mk=$('#mk');if(mk)mk.onclick=()=>{mark[c.id]=!mark[c.id];list();card()};
 const cp=$('#cp');if(cp)cp.onclick=async()=>{const t=c.n+' (ИНН '+c.inn+')\nОбраз: '+pt.name+(pt.how.length?'\nКак работать: '+pt.how.join('; '):'')+'\nНе предлагать сейчас: '+pt.not.join('; ')+'\n'+A.map((a,i)=>`${i+1}. ${a[0]} — ${a[2]}`).join('\n');try{await navigator.clipboard.writeText(t);$('#cpm').textContent='Скопировано'}catch(e){$('#cpm').textContent='Не удалось скопировать'}}}
$('#list').addEventListener('click',e=>{const b=e.target.closest('.it');if(b){cur=+b.dataset.id;list();card()}});
$('#f').addEventListener('submit',search);['per','frm','reg','ind'].forEach(id=>$('#'+id).addEventListener('change',search));
$('#q').addEventListener('input',search);
search();
}
</script>
</body>
</html>
